<style>
  html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; touch-action: none; overscroll-behavior: none; }
  body { color: #fff6ec; font: 500 13px/1.4 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #c:active { cursor: grabbing; }
  .ui { position: absolute; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(420px, calc(100% - 32px));
        display: flex; flex-direction: column; align-items: stretch; gap: 8px; pointer-events: none; }
  .bar { pointer-events: auto; display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 16px; border-radius: 999px;
         background: rgba(20,12,8,.42); border: 1px solid rgba(255,220,180,.18); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #date { min-width: 52px; font-variant-numeric: tabular-nums; }
  input[type=range] { flex: 1; accent-color: #e8742a; min-width: 0; }
  button { font: inherit; color: #1a0f08; background: rgba(255,236,214,.92); border: 0; border-radius: 999px; padding: 7px 14px; cursor: pointer; }
  #hint { text-align: center; color: rgba(255,246,236,.72); font-size: 12px; text-shadow: 0 1px 6px rgba(0,0,0,.6); transition: opacity .6s; }
  .src { position: absolute; right: 12px; top: max(10px, env(safe-area-inset-top)); color: rgba(255,246,236,.6); font-size: 11.5px; text-decoration: none; text-shadow: 0 1px 6px rgba(0,0,0,.5); }
  body.film .ui, body.film .src { display: none; }
  body.film #c { cursor: none; }
</style>
